<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Audit UK - Officer Dashboard</title>
    <!-- Load Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --brand-primary: #0056b3; 
            --ui-dark: #2c3e50;
            --ui-blue: #0056b3;
            --bg-color: #f4f4f9;
            --text-color: #333;
        }
        body { font-family: Arial, sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-color); }
        .sidebar { width: 250px; background: var(--ui-dark); color: white; position: fixed; height: 100vh; padding-top: 20px; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; font-size: 20px; color: white; }
        .sidebar-btn { display: block; width: 100%; background: none; color: white; border: none; padding: 15px 20px; text-align: left; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .sidebar-btn:hover, .sidebar-btn.active { background: rgba(0,0,0,0.3); border-left: 4px solid #3498db; }
        .main-content { margin-left: 250px; padding: 40px; }
        
        .panel { display: none; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #ddd; }
        .panel.active { display: block; }
        h3 { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; color: var(--ui-dark); }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="number"], input[type="color"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background-color: #fff; color: #333; }
        .color-group { display: flex; gap: 20px; }
        .color-group > div { flex: 1; }
        
        .btn { background-color: var(--ui-blue); color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .btn:hover { background-color: #004494; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; border: 1px solid #ddd; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f1f3f5; color: #333; font-weight: bold; }
        .action-btn { background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;}
        .action-btn:hover { background-color: #c82333; }
        
        #preview-logo { max-height: 80px; margin-top: 10px; display: none; border: 1px solid #ccc; padding: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 id="brand-title">HSE Audit UK</h2>
        <button class="sidebar-btn active" onclick="switchTab('branding-panel', this)">Global Branding</button>
        <button class="sidebar-btn" onclick="switchTab('project-panel', this)">Site & Manager Setup</button>
        <button class="sidebar-btn" onclick="switchTab('reports-panel', this)">Inspection Reports</button>
        <button class="sidebar-btn" style="margin-top: auto; border-top: 1px solid #444;" onclick="logout()">Log Out</button>
    </div>

    <div class="main-content">
        <div id="branding-panel" class="panel active">
            <h3>App-Wide Branding Configuration</h3>
            <div class="form-group"><label>Company Name</label><input type="text" id="company-name" placeholder="e.g., Regency Facades Ltd"></div>
            <div class="form-group"><label>Company Slogan</label><input type="text" id="company-slogan" placeholder="e.g., Safety First, Always"></div>
            <div class="color-group form-group">
                <div><label>Primary Brand Color</label><input type="color" id="brand-color-primary" value="#0056b3"></div>
                <div><label>Secondary Color</label><input type="color" id="brand-color-secondary" value="#2c3e50"></div>
            </div>
            <div class="form-group"><label>Footer Text</label><input type="text" id="footer-text" placeholder="e.g., © 2026 Regency Facades Ltd"></div>
            <div class="form-group"><label>Upload Logo</label><input type="file" id="logo-upload" accept="image/*"><input type="hidden" id="logo-base64"><img id="preview-logo"></div>
            <button class="btn" onclick="saveBranding()">Save & Apply Branding</button>
        </div>

        <div id="project-panel" class="panel">
            <h3>Site Manager Access Control</h3>
            <div style="display: flex; gap: 20px;">
                <div class="form-group" style="flex: 1;"><label>Site Manager Name</label><input type="text" id="manager-name" placeholder="e.g., Dumitru"></div>
                <div class="form-group" style="flex: 1;"><label>4-Digit Project Code</label><input type="number" id="project-code" placeholder="e.g., 1761"></div>
            </div>
            <button class="btn" onclick="addProject()">Authorize Manager Access</button>
            <table id="projects-table">
                <thead><tr><th>Project Code</th><th>Manager Name</th><th>Status</th><th>Action</th></tr></thead>
                <tbody id="projects-list"></tbody>
            </table>
        </div>

        <div id="reports-panel" class="panel">
            <h3>Live PUWER Inspection Reports</h3>
            <div class="form-group">
                <label>Fetch Database Records by Project:</label>
                <input type="number" id="filter-project" placeholder="e.g. 1761" style="padding: 10px; width: 250px; border-radius: 4px; border: 1px solid #ccc; display: inline-block;">
                <button class="btn" style="margin-left: 10px;" onclick="loadReports()">Pull from Supabase</button>
            </div>
            <table id="reports-table">
                <thead>
                    <tr>
                        <th>Date Submitted</th>
                        <th>Project Code</th>
                        <th>Inspector Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reports-list">
                    <tr><td colspan="4" style="text-align:center; color:#666;">Enter a project code and click Pull to retrieve records.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // SUPABASE CONFIGURATION
        // ==========================================
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            loadBranding();
            renderProjects();
        });

        function switchTab(panelId, btnElement) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            btnElement.classList.add('active');
        }

        // ... [Branding and Project Setup logic remains exactly the same] ...
        document.getElementById('logo-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('logo-base64').value = event.target.result;
                    document.getElementById('preview-logo').src = event.target.result;
                    document.getElementById('preview-logo').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        function saveBranding() { /* Save logic */ }
        function loadBranding() { /* Load logic */ }
        function addProject() { /* Add Project Logic */ }
        function renderProjects() { /* Render logic */ }
        function removeProject(index) { /* Remove logic */ }
        function logout() { window.location.href = 'index.html'; }

        // Fetch Live Reports from Supabase
        async function loadReports() {
            const projCode = document.getElementById('filter-project').value.trim();
            const list = document.getElementById('reports-list');
            
            if(!projCode) {
                alert("Please enter a project code to filter by.");
                return;
            }

            list.innerHTML = `<tr><td colspan="4" style="text-align:center;">Fetching records from database...</td></tr>`;

            try {
                // Fetch rows from 'puwer_inspections' where project_code matches
                const { data, error } = await supabase
                    .from('puwer_inspections')
                    .select('*')
                    .eq('project_code', projCode)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if(data.length === 0) {
                    list.innerHTML = `<tr><td colspan="4" style="text-align:center; color: red;">No reports found for Project ${projCode}</td></tr>`;
                    return;
                }

                list.innerHTML = ''; // clear table
                data.forEach(report => {
                    const formattedDate = new Date(report.created_at).toLocaleDateString('en-GB');
                    list.innerHTML += `
                        <tr>
                            <td>${formattedDate}</td>
                            <td><strong>${report.project_code}</strong></td>
                            <td>${report.inspector_name}</td>
                            <td><button class="btn" style="padding: 5px 10px;" onclick="viewReport('${report.id}')">View Details</button></td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Error fetching reports:", error);
                list.innerHTML = `<tr><td colspan="4" style="text-align:center; color: red;">Database connection failed.</td></tr>`;
            }
        }

        function viewReport(id) {
            alert("This will eventually generate the PDF for Database ID: " + id);
        }
    </script>
</body>
</html>
